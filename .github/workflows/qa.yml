name: QA
on:
  pull_request:
  push:
    branches: [main, cursor/closer-pwa-ab5f]
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright-core@1.49.1
      - run: npx --yes playwright@1.49.1 install --with-deps chromium
      - run: npm test
      - run: node tests/qa-full.mjs samsung
      - run: node tests/qa-full.mjs pixel
